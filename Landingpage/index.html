<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HypertuneAI - Distributed ML Training</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/index.css">
</head>
<body>
  <div id="root"></div>

  <script>
    const API_BASE = 'http://localhost:8000'; // Update with your backend URL
    
    // State management
    const state = {
      view: 'landing', // landing, auth, dashboard
      authTab: 'signin',
      user: null,
      token: null,
      sessions: [],
      loading: false,
      error: null,
      success: null,
      userStatus: 'OFFLINE'
    };

    // Check for existing token on load
    const savedToken = localStorage.getItem('token');
    const savedUser = localStorage.getItem('user');
    if (savedToken && savedUser) {
      state.token = savedToken;
      state.user = JSON.parse(savedUser);
      state.view = 'dashboard';
      loadDashboard();
    }

    // API calls
    async function apiCall(endpoint, method = 'GET', body = null, isFormData = false) {
      const headers = {};
      
      if (state.token) {
        headers['Authorization'] = `Bearer ${state.token}`;
      }
      
      if (!isFormData && body) {
        headers['Content-Type'] = 'application/json';
      }

      const options = {
        method,
        headers
      };

      if (body) {
        options.body = isFormData ? body : JSON.stringify(body);
      }

      const response = await fetch(`${API_BASE}${endpoint}`, options);
      
      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.detail || 'Request failed');
      }

      return response.json();
    }

    // Auth functions
    async function signup(username, email, password) {
      state.loading = true;
      state.error = null;
      render();

      try {
        await apiCall('/auth/signup', 'POST', { username, email, password });
        state.success = 'Account created! Please sign in.';
        state.authTab = 'signin';
      } catch (err) {
        state.error = err.message;
      } finally {
        state.loading = false;
        render();
      }
    }

    async function signin(email, password) {
      state.loading = true;
      state.error = null;
      render();

      try {
        const data = await apiCall('/auth/signin', 'POST', { email, password });
        state.token = data.access_token;
        state.user = { email, username: data.username };
        localStorage.setItem('token', state.token);
        localStorage.setItem('user', JSON.stringify(state.user));
        state.view = 'dashboard';
        await loadDashboard();
      } catch (err) {
        state.error = err.message;
      } finally {
        state.loading = false;
        render();
      }
    }

    async function joinSession() {
      try {
        const data = await apiCall('/sessions/join', 'POST');
        state.userStatus = 'ONLINE';
        state.success = 'You are now online and ready to receive tasks!';
        render();
      } catch (err) {
        state.error = err.message;
        render();
      }
    }

    async function leaveSession() {
      try {
        await apiCall('/sessions/leave', 'POST');
        state.userStatus = 'OFFLINE';
        state.success = 'You are now offline.';
        render();
      } catch (err) {
        state.error = err.message;
        render();
      }
    }

    async function startSession(formData) {
      state.loading = true;
      state.error = null;
      render();

      try {
        const data = await apiCall('/sessions/start', 'POST', formData, true);
        state.success = `Session ${data.session_uid} started successfully!`;
        await loadDashboard();
      } catch (err) {
        state.error = err.message;
      } finally {
        state.loading = false;
        render();
      }
    }

    async function loadDashboard() {
      // In a real app, you'd fetch user sessions here
      // For now, we'll just render the dashboard
      render();
    }

    function logout() {
      state.token = null;
      state.user = null;
      state.view = 'landing';
      state.userStatus = 'OFFLINE';
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      render();
    }

    // Render functions
    function renderLanding() {
      return `
        <div class="page-root">
          <div class="landing">
            <h1 class="hero-title">HypertuneAI</h1>
            <p class="hero-subtitle">
              Distributed machine learning training platform. Harness the power of collaborative hyperparameter optimization.
            </p>
            <div class="cta-group">
              <button class="cta-btn cta-primary" onclick="navigateTo('auth')">Get Started</button>
              <button class="cta-btn cta-secondary" onclick="navigateTo('auth')">Sign In</button>
            </div>
            <div class="features">
              <div class="feature-card">
                <div class="feature-icon">⚡</div>
                <h3 class="feature-title">Lightning Fast</h3>
                <p class="feature-desc">Distribute training across multiple peers for faster convergence</p>
              </div>
              <div class="feature-card">
                <div class="feature-icon">🔒</div>
                <h3 class="feature-title">Secure & Private</h3>
                <p class="feature-desc">Your data stays encrypted with enterprise-grade security</p>
              </div>
              <div class="feature-card">
                <div class="feature-icon">📊</div>
                <h3 class="feature-title">Real-time Analytics</h3>
                <p class="feature-desc">Monitor training progress and results in real-time</p>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderAuth() {
      const isSignin = state.authTab === 'signin';
      
      return `
        <div class="page-root">
          <div class="fixed-card">
            <div class="header">
              <div class="logo">
                <div class="logo-inner">⚡</div>
              </div>
              <h1 class="brand">HYPERTUNE</h1>
              <p class="subtitle">Distributed ML Training</p>
            </div>
            
            <div class="card">
              <div class="tabs">
                <button class="tab ${isSignin ? 'active' : ''}" onclick="switchTab('signin')">
                  Sign In
                  ${isSignin ? '<div class="tab-underline"></div>' : ''}
                </button>
                <button class="tab ${!isSignin ? 'active' : ''}" onclick="switchTab('signup')">
                  Sign Up
                  ${!isSignin ? '<div class="tab-underline"></div>' : ''}
                </button>
              </div>
              
              <div class="card-body">
                ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
                ${state.success ? `<div class="success-msg">${state.success}</div>` : ''}
                
                <form class="form" onsubmit="handleAuthSubmit(event)">
                  ${!isSignin ? `
                    <div class="field">
                      <label class="label">Username</label>
                      <input type="text" name="username" class="input" required>
                    </div>
                  ` : ''}
                  
                  <div class="field">
                    <label class="label">Email</label>
                    <input type="email" name="email" class="input" required>
                  </div>
                  
                  <div class="field">
                    <label class="label">Password</label>
                    <div class="password-row">
                      <input type="password" name="password" class="input" required>
                    </div>
                  </div>
                  
                  <div class="actions">
                    <button type="submit" class="primary-btn" ${state.loading ? 'disabled' : ''}>
                      ${state.loading ? '<div class="spinner"></div>' : (isSignin ? 'Sign In →' : 'Create Account →')}
                      <div class="btn-overlay"></div>
                    </button>
                  </div>
                </form>
              </div>
              
              <div class="card-footer">
                <div class="meta">
                  <span>${isSignin ? "Don't have an account?" : "Already have an account?"}</span>
                  <button class="meta-text" onclick="switchTab('${isSignin ? 'signup' : 'signin'}')" style="background:none;border:none;color:var(--accent);cursor:pointer;">
                    ${isSignin ? 'Sign Up' : 'Sign In'}
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderDashboard() {
      return `
        <div class="page-root">
          <div class="dashboard">
            <div class="dash-header">
              <div>
                <h1 class="dash-title">Welcome, ${state.user?.username || 'User'}</h1>
                <span class="status-badge status-${state.userStatus.toLowerCase()}">${state.userStatus}</span>
              </div>
              <button class="logout-btn" onclick="logout()">Logout</button>
            </div>

            ${state.error ? `<div class="error-msg">${state.error}</div>` : ''}
            ${state.success ? `<div class="success-msg">${state.success}</div>` : ''}

            <div class="section">
              <h2 class="section-title">Worker Status</h2>
              <div class="card" style="padding:20px;max-width:400px;">
                ${state.userStatus === 'OFFLINE' ? `
                  <p style="margin:0 0 16px;color:var(--muted);">Start accepting training tasks from other users</p>
                  <button class="primary-btn" onclick="joinSession()">
                    Go Online
                    <div class="btn-overlay"></div>
                  </button>
                ` : `
                  <p style="margin:0 0 16px;color:#86efac;">✓ You're online and ready to receive tasks</p>
                  <button class="primary-btn" style="background:#ef4444;" onclick="leaveSession()">
                    Go Offline
                  </button>
                `}
              </div>
            </div>

            <div class="section">
              <h2 class="section-title">Start New Training Session</h2>
              <form class="new-session-form" onsubmit="handleSessionSubmit(event)">
                <div class="field">
                  <label class="label">Dataset (CSV)</label>
                  <input type="file" name="file" class="input file-input" accept=".csv" required>
                </div>
                
                <div class="field">
                  <label class="label">Number of Peers</label>
                  <input type="number" name="num_peers" class="input" min="1" max="10" value="2" required>
                </div>
                
                <div class="field">
                  <label class="label">Hyperparameters (JSON Array)</label>
                  <textarea name="hyperparameters" class="input textarea" required>[
  {"learning_rate": 0.01, "batch_size": 32},
  {"learning_rate": 0.001, "batch_size": 64}
]</textarea>
                </div>
                
                <button type="submit" class="primary-btn" ${state.loading ? 'disabled' : ''}>
                  ${state.loading ? '<div class="spinner"></div>' : 'Start Training Session →'}
                  <div class="btn-overlay"></div>
                </button>
              </form>
            </div>

            <div class="section">
              <h2 class="section-title">Your Sessions</h2>
              <div class="session-grid">
                ${state.sessions.length === 0 ? `
                  <p style="color:var(--muted);">No sessions yet. Start a new training session above.</p>
                ` : state.sessions.map(s => `
                  <div class="session-card">
                    <div class="session-id">ID: ${s.id}</div>
                    <div class="session-info"><strong>Status:</strong> ${s.status}</div>
                    <div class="session-info"><strong>Peers:</strong> ${s.num_peers}</div>
                    <div class="session-info"><strong>Created:</strong> ${new Date(s.created_at).toLocaleString()}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function render() {
      const root = document.getElementById('root');
      
      if (state.view === 'landing') {
        root.innerHTML = renderLanding();
      } else if (state.view === 'auth') {
        root.innerHTML = renderAuth();
      } else if (state.view === 'dashboard') {
        root.innerHTML = renderDashboard();
      }
    }

    // Event handlers
    function navigateTo(view) {
      state.view = view;
      state.error = null;
      state.success = null;
      render();
    }

    function switchTab(tab) {
      state.authTab = tab;
      state.error = null;
      state.success = null;
      render();
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      
      if (state.authTab === 'signin') {
        signin(formData.get('email'), formData.get('password'));
      } else {
        signup(formData.get('username'), formData.get('email'), formData.get('password'));
      }
    }

    function handleSessionSubmit(e) {
      e.preventDefault();
      const formData = new FormData(e.target);
      startSession(formData);
    }

    // Initial render
    render();
  </script>
</body>
</html>
